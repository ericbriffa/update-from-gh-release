# Example update-from-gh-release config for SpeedBreaker (Steam Deck / Steam Machine, x86_64)
APP_NAME="SpeedBreaker"
REPO="SpeedBreakerProject/speedbreaker"
ASSET_PATTERN='^SpeedBreaker-steamos-x86_64\.tar\.xz$'          # regex on the asset's file name
CHECKSUM_PATTERN='^SpeedBreaker-steamos-x86_64\.tar\.xz\.sha256$'
INSTALL_DIR="$HOME/Games/SpeedBreaker"
REQUIRED_FILE="speedbreaker.sh"
RUNNING_MATCH="$INSTALL_DIR/lib"
